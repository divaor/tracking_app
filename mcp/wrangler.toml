# Cloudflare Worker for the tracker MCP connector. Deploy from the repo root:
#   npx wrangler@4 deploy -c mcp/wrangler.toml
# Secrets (never put them in this file):
#   npx wrangler@4 secret put GITHUB_TOKEN -c mcp/wrangler.toml
#   npx wrangler@4 secret put MCP_SECRET -c mcp/wrangler.toml   # the connector password
name = "tracker-mcp"
main = "worker.js"
compatibility_date = "2025-09-01"
# Serve only https://tracker-mcp.<subdomain>.workers.dev, without the extra
# per-version preview URLs Cloudflare adds by default.
workers_dev = true
preview_urls = false

[vars]
# owner/repo of your private data repository (the one the app syncs to).
TRACKER_REPO = "divaor/tracker-data"
# Leave empty for the repository's default branch.
TRACKER_BRANCH = ""
TRACKER_PATH = "tracker.json"
TRACKER_FILES_DIR = "files"
TRACKER_DEVICE = "Claude"
# Where the web app is published; used for item links in replies.
TRACKER_APP_URL = "https://divaor.github.io/tracking_app/"

# Single-use OAuth codes and refresh-token reuse detection. Wrangler creates
# the namespace (tracker-mcp-oauth-kv) on the first deploy and reuses it after
# that, so no id is needed. Remove these lines to run without it.
[[kv_namespaces]]
binding = "OAUTH_KV"
