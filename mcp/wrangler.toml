# Cloudflare Worker for the tracker MCP connector. Deploy from the repo root:
#   npx wrangler@4 deploy -c mcp/wrangler.toml
# Secrets (never put them in this file):
#   npx wrangler@4 secret put GITHUB_TOKEN -c mcp/wrangler.toml
#   npx wrangler@4 secret put MCP_SECRET -c mcp/wrangler.toml
name = "tracker-mcp"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# owner/repo of your private data repository (the one the app syncs to).
TRACKER_REPO = "divaor/tracker-data"
# Leave empty for the repository's default branch.
TRACKER_BRANCH = ""
TRACKER_PATH = "tracker.json"
TRACKER_FILES_DIR = "files"
TRACKER_DEVICE = "Claude"
# Where the web app is published; used for item links in replies.
TRACKER_APP_URL = "https://divaor.github.io/tracking_app/"
