# Publishes the web app (the app/ folder) to GitHub Pages so it can be opened
# and installed on a phone. Enable it once under Settings → Pages → Source:
# "GitHub Actions". Your tracker data is never part of the site.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub's own Pages workflow has them: deploy-pages looks the artifact up by
  # name, and right after the upload in the same job GitHub's list can still be empty
  # ("Found 0 artifact(s)"; every deploy of 11-24 failed so).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
