# Builds the desktop app for Windows, macOS and Linux and the Android app, and
# attaches them to a GitHub release. Trigger it by pushing a tag:
#   git tag v1.0.0 && git push origin v1.0.0
# or from Actions → Release desktop app → Run workflow with a tag (the tag is
# created on the chosen branch). Without a tag the run only builds.
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.3.0 (must match package.json). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: inputs.tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "::error::Tag $TAG does not match package.json ($version)"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  # The Android app (for Obtainium or installing by hand): an APK signed with the key in the
  # ANDROID_KEYSTORE secret (base64) and ANDROID_KEYSTORE_PASSWORD. Every release must use the
  # same key, or phones cannot update. Without the secrets the APK is left out of the release.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: The signing key
        id: key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE secret: the release has no Android app. Add the secrets (see the guide) and run the release again."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: npm ci
        if: steps.key.outputs.missing != 'true'
      - run: npx cap sync android
        if: steps.key.outputs.missing != 'true'
      - name: Build the APK
        if: steps.key.outputs.missing != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Check what the APK holds and who signed it
        if: steps.key.outputs.missing != 'true'
        env:
          EXPECTED_SIGNER: 0abb6f0b436980689186d847bbe5f955b020ed7b4aa11094fd1e81073de1f1d0
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          for f in assets/public/index.html assets/public/js/androidApp.js assets/public/js/app.js; do
            unzip -l "$apk" "$f" > /dev/null || { echo "::error::$f is missing from the APK"; exit 1; }
          done
          # Signed with the tracker's key (its certificate's SHA-256), or phones could not update it.
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --print-certs "$apk" | tee signer.txt
          grep -q "SHA-256 digest: $EXPECTED_SIGNER" signer.txt || { echo "::error::The APK is not signed with the tracker's release key"; exit 1; }
          ls -l "$apk"
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.missing != 'true'
        with:
          name: tracker-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*.apk

  release:
    needs: [build, android]
    # The desktop builds decide; the Android app joins when it built.
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
